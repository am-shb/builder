# Render Blueprint (ADR 0005): production only for now. Create it in the Render dashboard (New > Blueprint, branch
# main), as docs/runbooks/README.md says.
#
# No secret is in this file. Render asks for every `sync: false` value in the dashboard only when the Blueprint is
# first created; a service added later (builder-web) gets its values set by hand on its page. Render generates the
# internal token itself. Everything runs in US East, next to SurrealDB Cloud (AWS
# us-east-1) and Recall (us-east-1).
#
# CD: every service deploys a commit on main only after its CI checks pass (autoDeployTrigger: checksPass), and only
# when a path in its buildFilter changed. The pre-deploy command runs the migrations before the new instance
# starts; if it fails, the deploy stops. Render moves traffic to the new instance once its health check passes, and
# a failing one leaves the old instance serving.

envVarGroups:
  - name: builder-internal
    envVars:
      # The shared bearer token for the engine's /internal/* routes (ADR 0008). The api sends it, the engine checks
      # it. Generated by Render: 256 random bits, base64.
      - key: ENGINE_INTERNAL_TOKEN
        generateValue: true

services:
  - type: web
    name: builder-engine
    runtime: docker
    plan: starter
    region: virginia
    branch: main
    # The engine keeps live sessions in memory, so it runs as one instance.
    numInstances: 1
    # No rootDir: it would hide contracts/ from the build. The image builds from the repo root.
    dockerContext: .
    dockerfilePath: ./apps/engine/Dockerfile
    # The image's own command (CMD) starts the server. --prefix makes this independent of the working directory.
    preDeployCommand: npm --prefix /app/apps/engine run migrate
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/engine/**
        - contracts/**
        - package.json
        - package-lock.json
        - .nvmrc
        - .dockerignore
      # Tests, scripts and READMEs aren't used at runtime, so a change to them alone doesn't deploy (an engine deploy
      # ends live meetings). Not every .md: the engine reads its prompts from src/agent/prompts/*.md.
      ignoredPaths:
        - apps/engine/test/**
        - apps/engine/scripts/**
        - apps/engine/README.md
        - contracts/README.md
    envVars:
      - key: NODE_ENV
        value: production
      # Render's default port for web services. The api reaches the engine on it over the private network.
      - key: PORT
        value: 10000
      - key: RECALL_REGION
        value: us-east-1
      # PUBLIC_API_BASE_URL isn't set: the engine uses RENDER_EXTERNAL_URL, which Render sets. Set it in the dashboard
      # only for a custom domain.
      - fromGroup: builder-internal
      # The api's private-network address, host:port (builder-api:10000), where the engine sends session status
      # changes (A2: POST /internal/engine-events, with ENGINE_INTERNAL_TOKEN from builder-internal). The engine reads
      # a bare host:port as http. Unset, the engine sends nothing and the api's statuses stay at what the start said.
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: builder-api
          property: hostport
      # SurrealDB Cloud: wss://<instance host>, and the `engine` user that infra/surrealdb/setup.surql defines.
      - key: SURREAL_URL
        sync: false
      - key: SURREAL_USER
        sync: false
      - key: SURREAL_PASS
        sync: false
      # The Recall workspace in us-east-1.
      - key: RECALL_API_KEY
        sync: false
      - key: RECALL_WEBHOOK_VERIFICATION_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Optional: can stay empty (apps/engine/.env.example).
      - key: TTS_VOICE
        sync: false
      - key: BOT_VARIANT
        sync: false

  - type: web
    name: builder-api
    runtime: docker
    plan: starter
    region: virginia
    branch: main
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    preDeployCommand: npm --prefix /app/apps/api run migrate
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/api/**
        - contracts/**
        - package.json
        - package-lock.json
        - .nvmrc
        - .dockerignore
      # Tests, scripts and READMEs aren't used at runtime, so a change to them alone doesn't deploy.
      ignoredPaths:
        - apps/api/test/**
        - apps/api/scripts/**
        - apps/api/README.md
        - contracts/README.md
    envVars:
      # Makes SURREAL_URL required, so the api never falls back to a database in its own process.
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # The engine's private-network address, host:port (builder-engine:10000). The api reads a bare host:port as http.
      - key: ENGINE_INTERNAL_URL
        fromService:
          type: web
          name: builder-engine
          property: hostport
      - fromGroup: builder-internal
      # SurrealDB Cloud: the same wss:// URL as the engine, and the `api` user that setup.surql defines.
      - key: SURREAL_URL
        sync: false
      - key: SURREAL_USER
        sync: false
      - key: SURREAL_PASS
        sync: false
      # Clerk: set both or neither (apps/api/.env.example). Neither: the /v1 routes answer 503.
      - key: CLERK_JWT_KEY
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      # Per-session limits until billing exists: set both or neither (D5 in docs/plans/api-first-slice.md).
      - key: DEFAULT_MAX_USD
        sync: false
      - key: DEFAULT_MAX_MINUTES
        sync: false

  # The web app (ADR 0012): a static site on Render's CDN, free. No Dockerfile: a static site runs no process (ADR 0005,
  # amended). Static sites take no region, plan, instances, pre-deploy command or health check.
  - type: web
    name: builder-web
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    # No rootDir, as for the other two: the build needs contracts/. Only the web workspace's packages are installed.
    buildCommand: npm ci --workspace @builder/web --include-workspace-root && npm run build -w @builder/web
    staticPublishPath: ./apps/web/dist
    buildFilter:
      paths:
        - apps/web/**
        - contracts/**
        - package.json
        - package-lock.json
        - .nvmrc
      ignoredPaths:
        - apps/web/test/**
        - apps/web/README.md
        - contracts/README.md
    # Every path is the app: React Router handles it in the browser. Render serves a file that exists (/assets/*)
    # before it applies a rewrite.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Headers that name no URL (ADR 0012, docs/plans/web-first-slice.md "Security"). The policy that names the api and
    # Clerk is written into index.html at build time (apps/web/build/csp.ts). Set these only here: Render keeps rules
    # made in the dashboard that aren't in this file.
    headers:
      # What a <meta> policy can't do: refuse to be framed, plus a backstop for the page's own policy.
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      # The stage link carries a token: no page of the app sends its address anywhere.
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      # Another site's window can't script this one; the stage still opens in a new tab (with noopener).
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
    envVars:
      # Render's docs read NODE_VERSION (not .nvmrc) for a static site: the same Node as the Dockerfiles.
      - key: NODE_VERSION
        value: 24.22.0
      # Read at build time, so a change needs a new deploy of the site. Not secrets, but kept out of the repo. Render
      # asks for sync: false values only when a Blueprint is first created: on this existing Blueprint, set them on
      # builder-web in the dashboard (docs/runbooks/README.md).
      # The Clerk publishable key, from the same Clerk instance as builder-api's CLERK_JWT_KEY.
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      # builder-api's public https origin, such as https://builder-api-xxxx.onrender.com.
      - key: VITE_API_URL
        sync: false
      # The Android app's APK, an asset on this repository's releases page (ADR 0012, amended): the one address in this
      # file, since it names the repository, not a deployment. The landing page offers "Get the Android app" with it. A
      # new APK is a new release tag and a change to this line.
      - key: VITE_ANDROID_APP_URL
        value: https://github.com/am-shb/builder/releases/download/v0.1.0/builder-android.apk
