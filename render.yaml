# Render Blueprint (ADR 0005): production only for now. Create it in the Render dashboard (New > Blueprint, branch
# main), as docs/runbooks/README.md says.
#
# No secret is in this file. Render asks for every `sync: false` value in the dashboard when the Blueprint is first
# created, and generates the internal token itself. Everything runs in US East, next to SurrealDB Cloud (AWS
# us-east-1) and Recall (us-east-1).
#
# CD: both services deploy a commit on main only after its CI checks pass (autoDeployTrigger: checksPass), and only
# when a path in their buildFilter changed. The pre-deploy command runs the migrations before the new instance
# starts; if it fails, the deploy stops. Render moves traffic to the new instance once its health check passes, and
# a failing one leaves the old instance serving.

envVarGroups:
  - name: builder-internal
    envVars:
      # The shared bearer token for the engine's /internal/* routes (ADR 0008). The api sends it, the engine checks
      # it. Generated by Render: 256 random bits, base64.
      - key: ENGINE_INTERNAL_TOKEN
        generateValue: true

services:
  - type: web
    name: builder-engine
    runtime: docker
    plan: starter
    region: virginia
    branch: main
    # The engine keeps live sessions in memory, so it runs as one instance.
    numInstances: 1
    # No rootDir: it would hide contracts/ from the build. The image builds from the repo root.
    dockerContext: .
    dockerfilePath: ./apps/engine/Dockerfile
    # The image's own command (CMD) starts the server. --prefix makes this independent of the working directory.
    preDeployCommand: npm --prefix /app/apps/engine run migrate
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/engine/**
        - contracts/**
        - package.json
        - package-lock.json
        - .nvmrc
        - .dockerignore
      # Tests, scripts and READMEs aren't used at runtime, so a change to them alone doesn't deploy (an engine deploy
      # ends live meetings). Not every .md: the engine reads its prompts from src/agent/prompts/*.md.
      ignoredPaths:
        - apps/engine/test/**
        - apps/engine/scripts/**
        - apps/engine/README.md
        - contracts/README.md
    envVars:
      - key: NODE_ENV
        value: production
      # Render's default port for web services. The api reaches the engine on it over the private network.
      - key: PORT
        value: 10000
      - key: RECALL_REGION
        value: us-east-1
      # PUBLIC_API_BASE_URL isn't set: the engine uses RENDER_EXTERNAL_URL, which Render sets. Set it in the dashboard
      # only for a custom domain.
      - fromGroup: builder-internal
      # SurrealDB Cloud: wss://<instance host>, and the `engine` user that infra/surrealdb/setup.surql defines.
      - key: SURREAL_URL
        sync: false
      - key: SURREAL_USER
        sync: false
      - key: SURREAL_PASS
        sync: false
      # The Recall workspace in us-east-1.
      - key: RECALL_API_KEY
        sync: false
      - key: RECALL_WEBHOOK_VERIFICATION_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Optional: can stay empty (apps/engine/.env.example).
      - key: TTS_VOICE
        sync: false
      - key: BOT_VARIANT
        sync: false

  - type: web
    name: builder-api
    runtime: docker
    plan: starter
    region: virginia
    branch: main
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    preDeployCommand: npm --prefix /app/apps/api run migrate
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/api/**
        - contracts/**
        - package.json
        - package-lock.json
        - .nvmrc
        - .dockerignore
      # Tests, scripts and READMEs aren't used at runtime, so a change to them alone doesn't deploy.
      ignoredPaths:
        - apps/api/test/**
        - apps/api/scripts/**
        - apps/api/README.md
        - contracts/README.md
    envVars:
      # Makes SURREAL_URL required, so the api never falls back to a database in its own process.
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # The engine's private-network address, host:port (builder-engine:10000). The api reads a bare host:port as http.
      - key: ENGINE_INTERNAL_URL
        fromService:
          type: web
          name: builder-engine
          property: hostport
      - fromGroup: builder-internal
      # SurrealDB Cloud: the same wss:// URL as the engine, and the `api` user that setup.surql defines.
      - key: SURREAL_URL
        sync: false
      - key: SURREAL_USER
        sync: false
      - key: SURREAL_PASS
        sync: false
      # Clerk: set both or neither (apps/api/.env.example). Neither: the /v1 routes answer 503.
      - key: CLERK_JWT_KEY
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      # Per-session limits until billing exists: set both or neither (D5 in docs/plans/api-first-slice.md).
      - key: DEFAULT_MAX_USD
        sync: false
      - key: DEFAULT_MAX_MINUTES
        sync: false
