<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<script type="importmap">{"imports":{"@renderer/":"/renderer/"}}</script>
<link rel="stylesheet" href="/renderer/theme.css">
<title>Builder Stage</title>
<style>
  /* Rendered by the Recall bot at 1280x720 and screenshared into the meeting at 15 fps, on a
     small CPU with no GPU. So: no animated blur/glow/shadow, no gradients, only transform and
     opacity animate (each animated part on its own layer via will-change), every animation is
     stepped by the shared 15 fps clock, and text is large and high-contrast so it survives
     video compression.

     Layout (px):  header 0-52 | prototype 20,56 872x528   | panel 908,56 352x472
                               | captions  20,596 872x108  | dock  908,540 352x164 */
  :root { --bg:#0f1115; --panel:#171a21; --ink:#f4f6fa; --muted:#b4bccb; --accent:#8fb0ff; --live:#3ddc84;
          --agreed:#34c473; --agreed-bg:#132219; --pending:#f0a43a; --pending-bg:#231c10; --track:#3a404d;
          --ask:#c7a6ff; --speaker:#ffd166; --font:system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin:0; width:1280px; height:720px; overflow:hidden; background:var(--bg); color:var(--ink); font:18px/1.4 var(--font); }

  header { position:absolute; left:20px; top:0; right:20px; height:52px; display:flex; align-items:center; gap:10px; font-weight:800; font-size:22px; }
  header .dot { width:12px; height:12px; border-radius:50%; background:var(--live); }
  header .sep, header #phase { color:var(--muted); font-weight:600; }

  #canvas { position:absolute; left:20px; top:56px; width:872px; height:528px; border-radius:12px; background:#fff; overflow:hidden; }
  #proto { position:absolute; inset:0; overflow:hidden; }
  /* Nothing built yet: Builder takes centre stage over this (see .builder placement below). */
  #placeholder { position:absolute; inset:0; background:var(--panel); }
  #placeholder .sub { position:absolute; left:0; right:0; top:398px; text-align:center; color:var(--muted); font-size:22px; }

  /* ---------- right panel: Agreed / Pending / Open questions ---------- */
  #panel { position:absolute; left:908px; top:56px; width:352px; height:472px; padding:14px 14px; border-radius:12px; background:var(--panel);
           display:flex; flex-direction:column; gap:14px; overflow:hidden;
           --b-draft:var(--pending); --b-agreed:var(--agreed); /* the settled morph, in panel colours */ }
  #panel h2 { margin:0 0 8px; font:800 15px/1 var(--font); letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); }
  #panel ul { position:relative; list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .item { position:relative; display:flex; align-items:flex-start; gap:10px; padding:7px 10px; border-radius:10px; border:2px solid transparent; font:600 20px/1.3 var(--font); }
  .item .txt { flex:1; min-width:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .item.is-agreed { border:2px solid var(--agreed); background:var(--agreed-bg); }
  .item.is-pending { border:2px dashed var(--pending); background:var(--pending-bg); --hole:var(--pending-bg); }
  .item.is-open { background:#1e222b; }
  .mark { flex:none; width:28px; height:28px; margin-top:-1px; border-radius:50%; display:flex; align-items:center; justify-content:center; font:900 18px/1 var(--font); color:var(--bg); }
  .mark.check { background:var(--agreed); }
  .mark.ask { background:var(--ask); }
  #panel .none, #panel .more { color:var(--muted); font:500 18px/1.3 var(--font); padding:2px 4px; }
  /* Countdown ring: amber is the time left in the 30 s no-objection window. Two rotating halves
     (transform only) paint the elapsed part in the track colour; a hole makes the pie a ring. */
  .cd { position:relative; overflow:hidden; background:var(--pending); }
  .cd::after { content:""; position:absolute; inset:6px; border-radius:50%; background:var(--hole); }
  .cd-half { position:absolute; top:0; width:14px; height:28px; overflow:hidden; }
  .cd-half.r { left:14px; } .cd-half.l { left:0; }
  .cd-half i { position:absolute; top:0; width:14px; height:28px; background:var(--track); will-change:transform; }
  .cd-half.r i { left:-14px; transform-origin:100% 50%; }
  .cd-half.l i { left:14px; transform-origin:0 50%; }

  /* ---------- captions ---------- */
  #captions { position:absolute; left:20px; top:596px; width:872px; height:108px; padding:7px 18px; border-radius:12px; background:var(--panel);
              font-size:24px; line-height:1.3; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; }
  .cap { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; }
  .cap b { color:var(--speaker); margin-right:10px; }
  .cap.is-agent b { color:var(--accent); }
  .cap.partial { color:var(--muted); }

  #dock { position:absolute; left:908px; top:540px; width:352px; height:164px; border-radius:12px; background:var(--panel); transition:opacity 500ms ease-out; }
  #builder[data-placement="center"] ~ #dock { opacity:0; } /* empty while Builder is centre stage */

  /* ---------- Builder (character.js builds the parts) ---------- */
  .builder { position:absolute; inset:0; z-index:50; pointer-events:none; --mood:var(--accent); }
  .builder[data-mood="thinking"] { --mood:#ffd166; }
  .builder[data-mood="building"] { --mood:#5ee6a8; }
  .builder[data-mood="speaking"] { --mood:#dce8ff; }
  .builder[data-mood="curious"]  { --mood:var(--ask); }
  .builder[data-mood="unsure"]   { --mood:#ffb366; }
  .builder[data-mood="pleased"]  { --mood:#ff8fa3; }
  .bot { position:absolute; left:0; top:0; width:150px; height:220px; transform-origin:0 0; }
  .bot-label { position:absolute; left:0; top:0; width:220px; text-align:center; font:800 32px/44px var(--font); color:var(--mood); transform-origin:0 0; }
  /* Centre stage: centred on the prototype area. Dock: bottom-right, label to its left. */
  #builder[data-placement="center"] .bot { transform:translate(366px, 131px) scale(1.2); }
  #builder[data-placement="center"] .bot-label { transform:translate(346px, 399px); }
  #builder[data-placement="dock"] .bot { transform:translate(1131px, 552px) scale(0.7); }
  #builder[data-placement="dock"] .bot-label { transform:translate(916px, 600px); }

  .bot div { position:absolute; }
  .bot-rig, .bot-pose, .bot-act, .bot-eye, .bot-eyeball, .bot-arc, .bot-cheek, .bot-mouth, .bot-bulb, .bot-ring,
  .bot-dot, .bot-q, .bot-wave, .bot-block { will-change:transform, opacity; }
  .bot-rig, .bot-pose, .bot-act { left:0; top:0; width:150px; height:170px; }
  .bot-rig { animation:bot-bob 2.4s ease-in-out infinite; }
  .bot-pose, .bot-act { transform-origin:75px 150px; }
  .bot-pose { transition:transform 400ms ease-out; }
  .bot-ring { left:0; top:8px; width:150px; height:150px; border-radius:50%; border:3px solid var(--accent); opacity:0; }
  .bot-antenna { left:73px; top:0; width:4px; height:26px; background:#9fb4ff; border-radius:2px; }
  .bot-bulb { left:63px; top:-12px; width:24px; height:24px; border-radius:50%; background:#ffd166; }
  .bot-head { left:0; top:24px; width:150px; height:118px; border-radius:38px; background:#7f9dff; border-bottom:8px solid #6283f0; }
  .bot-face { left:20px; top:18px; width:110px; height:70px; border-radius:26px; background:#141826; }
  .bot-eye { top:12px; width:22px; height:30px; transition:transform 300ms ease-out; }
  .bot-eye.l { left:22px; } .bot-eye.r { left:66px; }
  .bot-eyeball { left:0; top:0; width:22px; height:30px; border-radius:12px; background:#dce8ff; animation:bot-blink 4.2s infinite; transition:opacity 250ms ease-out; }
  .bot-arc { left:-3px; top:8px; width:28px; height:16px; border:6px solid #dce8ff; border-bottom:0; border-radius:16px 16px 0 0; opacity:0; transition:opacity 250ms ease-out; }
  .bot-cheek { top:46px; width:16px; height:8px; border-radius:50%; background:#ff8fa3; opacity:.55; transition:opacity 300ms ease-out, transform 300ms ease-out; }
  .bot-cheek.l { left:6px; } .bot-cheek.r { left:88px; }
  .bot-mouth { opacity:0; transition:opacity 250ms ease-out, transform 300ms ease-out; }
  .bot-mouth.smile { left:41px; top:46px; width:28px; height:13px; border:4px solid #cfe0ff; border-top:0; border-radius:0 0 16px 16px; }
  .bot-mouth.flat { left:41px; top:51px; width:28px; height:5px; border-radius:3px; background:#cfe0ff; }
  .bot-mouth.open { left:42px; top:43px; width:26px; height:22px; border-radius:50%; background:#cfe0ff; transform-origin:50% 0; transition:opacity 250ms ease-out; /* transform follows setMouth */ }
  .bot-mouth.grin { left:35px; top:43px; width:40px; height:20px; border-radius:0 0 20px 20px; background:#cfe0ff; }
  .bot-dot { border-radius:50%; background:#ffd166; opacity:0; transition:opacity 300ms ease-out; }
  .bot-dot.d1 { left:124px; top:18px; width:10px; height:10px; }
  .bot-dot.d2 { left:136px; top:4px; width:13px; height:13px; }
  .bot-dot.d3 { left:150px; top:-12px; width:17px; height:17px; }
  .bot-q { left:130px; top:-26px; font:900 50px/1 var(--font); color:var(--ask); opacity:0; transform:translateY(10px) scale(.8); transition:opacity 300ms ease-out, transform 400ms ease-out; }
  .bot-wave { top:60px; width:17px; height:36px; border:4px solid var(--accent); opacity:0; transition:opacity 250ms ease-out; }
  .bot-wave.l { left:-26px; border-right:0; border-radius:18px 0 0 18px; }
  .bot-wave.r { left:159px; border-left:0; border-radius:0 18px 18px 0; }
  .bot-blocks { left:18px; top:184px; width:114px; height:30px; }
  .bot-block { top:0; width:30px; height:30px; border-radius:8px; opacity:0; transform:translateY(12px); transition:opacity 300ms ease-out, transform 300ms ease-out; }
  .bot-block.b1 { left:0; background:#ff8a80; } .bot-block.b2 { left:42px; background:#ffd166; } .bot-block.b3 { left:84px; background:#5ee6a8; }

  /* listening: rings pulse while participants speak (hear()). */
  .builder.hearing[data-mood="listening"] .bot-ring { animation:bot-ring 1.8s ease-out infinite; }
  .builder.hearing[data-mood="listening"] .bot-ring.two { animation-delay:.9s; }
  .builder[data-mood="listening"] .bot-mouth.smile { opacity:1; }
  /* thinking: eyes up, antenna blinks, a trail of thought dots. */
  .builder[data-mood="thinking"] .bot-pose { transform:rotate(-6deg); }
  .builder[data-mood="thinking"] .bot-eye { transform:translate(5px, -8px) scaleY(.8); }
  .builder[data-mood="thinking"] .bot-bulb { animation:bot-pulse 1.2s ease-in-out infinite; }
  .builder[data-mood="thinking"] .bot-mouth.flat { opacity:1; transform:translateX(7px) scaleX(.45); }
  .builder[data-mood="thinking"] .bot-dot { opacity:1; animation:bot-pulse 1.5s ease-in-out infinite; }
  .builder[data-mood="thinking"] .bot-dot.d2 { animation-delay:.25s; }
  .builder[data-mood="thinking"] .bot-dot.d3 { animation-delay:.5s; }
  /* building: focused eyes on the blocks, blocks hop. */
  .builder[data-mood="building"] .bot-pose { transform:translateY(5px); }
  .builder[data-mood="building"] .bot-eye { transform:translateY(9px) scaleY(.45); }
  .builder[data-mood="building"] .bot-mouth.flat { opacity:1; transform:scaleX(.8); }
  .builder[data-mood="building"] .bot-block { opacity:1; transform:none; animation:bot-hop 1.5s ease-in-out infinite; }
  .builder[data-mood="building"] .bot-block.b2 { animation-delay:.18s; }
  .builder[data-mood="building"] .bot-block.b3 { animation-delay:.36s; }
  /* speaking: open mouth driven by setMouth, sound waves either side. */
  .builder[data-mood="speaking"] .bot-mouth.open { opacity:1; }
  .builder[data-mood="speaking"] .bot-wave { animation:bot-wave .9s ease-in-out infinite alternate; }
  .builder[data-mood="speaking"] .bot-wave.r { animation-delay:.45s; }
  /* curious: one raised eye, head tilted, a question mark. */
  .builder[data-mood="curious"] .bot-pose { transform:rotate(7deg); }
  .builder[data-mood="curious"] .bot-eye.r { transform:translateY(-9px) scale(1.12, 1.2); }
  .builder[data-mood="curious"] .bot-eye.l { transform:translateY(3px) scaleY(.8); }
  .builder[data-mood="curious"] .bot-mouth.smile { opacity:1; transform:scale(.7); }
  .builder[data-mood="curious"] .bot-q { opacity:1; transform:none; }
  /* unsure: tilted mouth, one squinting eye, a slow sway. */
  .builder[data-mood="unsure"] .bot-act { animation:bot-sway 2.4s ease-in-out infinite; }
  .builder[data-mood="unsure"] .bot-eye.l { transform:translateY(9px) scaleY(.4); }
  .builder[data-mood="unsure"] .bot-eye.r { transform:translateY(-2px); }
  .builder[data-mood="unsure"] .bot-mouth.flat { opacity:1; transform:rotate(-16deg); }
  /* pleased: happy eyes, a wide grin, bright cheeks, a small bounce. */
  .builder[data-mood="pleased"] .bot-act { animation:bot-bounce 600ms ease-out 2; }
  .builder[data-mood="pleased"] .bot-eyeball { opacity:0; }
  .builder[data-mood="pleased"] .bot-arc { opacity:1; }
  .builder[data-mood="pleased"] .bot-mouth.grin { opacity:1; }
  .builder[data-mood="pleased"] .bot-cheek { opacity:1; transform:scale(1.25); }

  @keyframes bot-bob    { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
  @keyframes bot-blink  { 0%,44%,48%,100% { transform:scaleY(1); } 46% { transform:scaleY(.1); } }
  @keyframes bot-pulse  { 0%,100% { opacity:1; } 50% { opacity:.25; } }
  @keyframes bot-ring   { 0% { opacity:.7; transform:scale(.85); } 100% { opacity:0; transform:scale(1.6); } }
  @keyframes bot-hop    { 0%,100% { transform:translateY(0) rotate(0); } 35% { transform:translateY(-18px) rotate(-8deg); } 60% { transform:translateY(0) rotate(0); } }
  @keyframes bot-wave   { from { opacity:.3; } to { opacity:1; } }
  @keyframes bot-sway   { 0%,100% { transform:rotate(-5deg); } 50% { transform:rotate(5deg); } }
  @keyframes bot-bounce { 0%,100% { transform:translateY(0); } 40% { transform:translateY(-14px); } }
</style>
</head>
<body>
<header><span class="dot"></span><span>Builder</span> <span class="sep">·</span> <span id="phase">Opening</span></header>
<div id="canvas">
  <div id="proto"></div>
  <div id="placeholder"><div class="sub">Describe what you want to build. The prototype will appear here.</div></div>
</div>
<aside id="panel" class="m-root">
  <section><h2>Agreed</h2><ul id="agreed"></ul></section>
  <section><h2>Pending</h2><ul id="pending"></ul></section>
  <section><h2>Open questions</h2><ul id="open"></ul></section>
</aside>
<footer id="captions"></footer>
<div id="builder"></div>
<div id="dock"></div>
<script type="module">
import { connectStage } from "@renderer/client.js";
import { renderTree } from "@renderer/render.js";
import { initialUiState, reduceInteraction, bindInteractions, findNode } from "@renderer/interact.js";
import { startClock, onFrame, animate } from "@renderer/clock.js";
import { screenTransitionEndsAt, fadeOutInPlace, playSettled, ENTER_MS, GLIDE_MS } from "@renderer/motion.js";
import { createFocusQueue, focusTargets, playFocus, showPendingRegion, animatePointer, SPOTLIGHT_MS } from "@renderer/focus.js";
import { createCharacter } from "@renderer/character.js";

const EASE = "ease-out";
const protoEl = document.getElementById("proto");
const character = createCharacter(document.getElementById("builder"));
let proto = null;
let ui = null;
let nodes = new Map();

// `changes` animates the redraw: a patch's changes, or [] for a local interaction.
function draw(changes) {
  if (!proto) return;
  if (!ui) ui = initialUiState(proto);
  if (!findNode(proto, ui.screen)) ui = { ...ui, screen: proto.currentScreen };
  nodes = renderTree(protoEl, proto, ui, changes);
  // Builder takes centre stage until the first real content exists, then moves to the dock.
  const screens = proto.root.children.filter((c) => c.type === "Screen");
  const built = screens.some((sc) => sc.children.length);
  document.getElementById("placeholder").hidden = built;
  character.setPlacement(built ? "dock" : "center");
}

bindInteractions(protoEl, () => proto, () => ui, (next) => { ui = next; draw([]); });

// Where node `id` sits: its parent's id and the Screen holding it (null when not found).
function locate(p, id) {
  const walk = (n, parent, screen) => {
    const s = n.type === "Screen" ? n.id : screen;
    if (n.id === id) return { parent, screen: s };
    for (const c of n.children) {
      const r = walk(c, n.id, s);
      if (r) return r;
    }
    return null;
  };
  return walk(p.root, null, null) ?? { parent: null, screen: null };
}

// Follow the change: to the current screen when the patch set it (the stage may have followed
// an earlier change elsewhere), else to the screen the first change lands on.
function followScreen(prevProto, changes) {
  if (!prevProto || prevProto.currentScreen !== proto.currentScreen || changes.some((c) => c.kind === "screen")) {
    return proto.currentScreen;
  }
  for (const c of changes) {
    const screen = locate(c.kind === "removed" ? prevProto : proto, c.id).screen;
    return screen ?? ui.screen;
  }
  return ui.screen;
}

// A removal is spotlit on the parent it left, so its label still says what went.
function focusable(prevProto, changes) {
  return changes.map((c) => (c.kind === "removed" && prevProto ? { ...c, id: locate(prevProto, c.id).parent ?? c.id } : c));
}

// Focus moments play one at a time, after any screen slide has landed.
const focusQueue = createFocusQueue({ playMs: SPOTLIGHT_MS });
const shown = (el) => !!el && el.isConnected && el.getClientRects().length > 0;
onFrame((now) => {
  if (now < screenTransitionEndsAt()) return;
  const c = focusQueue.next(now, (ch) => shown(nodes.get(ch.id)));
  if (c) playFocus(nodes.get(c.id), c);
});

let commands = Promise.resolve(); // voice commands run in order, each after its pointer cue

// ---------- header and right panel: phase, Agreed / Pending / Open questions ----------
const PENDING_MS = 30_000; // NO_OBJECTION_MS (src/consensus/doc.ts): a pending item auto-agrees then
const SHOW = { agreed: 4, pending: 3, open: 3 }; // newest kept; older ones fold into "+N earlier"
const EMPTY = { agreed: "Nothing agreed yet", pending: "Nothing waiting", open: "No open questions" };
const PHASES = { opening: "Opening", understand: "Understand", explore: "Explore", converge: "Converge", detail: "Detail", recap: "Recap" };
const lists = { agreed: document.getElementById("agreed"), pending: document.getElementById("pending"), open: document.getElementById("open") };
const panelItems = new Map(); // "d:<id>" | "q:<id>" -> li, reused as a decision moves between lists
const panelNotes = new Map(); // "<list>:none" | "<list>:more" -> li
const glides = new WeakMap(); // li -> its in-flight glide

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function note(list, kind, text) {
  const key = `${list}:${kind}`;
  let n = panelNotes.get(key);
  if (!n) panelNotes.set(key, (n = el("li", kind)));
  n.textContent = text;
  return n;
}

function countdown(since) {
  const cd = el("span", "mark cd");
  const r = el("i");
  const l = el("i");
  const half = (side, i) => { const h = el("span", `cd-half ${side}`); h.append(i); return h; };
  cd.append(half("r", r), half("l", l));
  // Already-elapsed time is a negative delay, so a reconnect shows the true time left.
  const elapsed = Math.min(PENDING_MS, Math.max(0, Date.now() - since));
  const timing = { duration: PENDING_MS, delay: -elapsed, fill: "forwards", easing: "linear" };
  const turn = (deg) => ({ transform: `rotate(${deg}deg)` });
  animate(r, [turn(0), { ...turn(180), offset: 0.5 }, turn(180)], timing);
  animate(l, [turn(0), { ...turn(0), offset: 0.5 }, turn(180)], timing);
  return cd;
}

function updateItem(li, it) {
  const wasState = li.dataset.state;
  li.className = `item is-${it.kind}`;
  li.dataset.state = it.kind;
  const txt = li.querySelector(".txt");
  if (txt.textContent !== it.text) txt.textContent = it.text;
  const mark = li.querySelector(".mark");
  if (it.kind === "pending") {
    const since = String(it.since ?? li.dataset.seen);
    if (wasState !== "pending" || li.dataset.since !== since) {
      li.dataset.since = since;
      mark.replaceWith(countdown(Number(since)));
    }
  } else if (wasState !== it.kind) {
    mark.replaceWith(el("span", it.kind === "agreed" ? "mark check" : "mark ask", it.kind === "agreed" ? "✓" : "?"));
  }
}

function renderDoc(doc) {
  document.getElementById("phase").textContent = PHASES[doc.phase] ?? doc.phase;
  const decisions = doc.decisions ?? [];
  const want = {
    agreed: decisions.filter((d) => d.status === "agreed").map((d) => ({ key: `d:${d.id}`, id: d.id, kind: "agreed", text: d.text })),
    pending: decisions.filter((d) => d.status === "pending").map((d) => ({ key: `d:${d.id}`, id: d.id, kind: "pending", text: d.text, since: d.pendingSince })),
    open: (doc.openQuestions ?? []).map((q) => ({ key: `q:${q.id}`, id: q.id, kind: "open", text: q.text })),
  };
  const keep = new Set(Object.entries(want).flatMap(([list, all]) => all.slice(-SHOW[list]).map((it) => it.key)));

  // First: where everything is now (mid-glide included), then let go of in-flight glides.
  const before = new Map();
  for (const [key, li] of panelItems) before.set(key, li.getBoundingClientRect());
  for (const li of panelItems.values()) glides.get(li)?.cancel();
  for (const [key, li] of panelItems) {
    if (keep.has(key)) continue;
    panelItems.delete(key);
    li.removeAttribute("data-decision-id");
    li.removeAttribute("data-question-id");
    fadeOutInPlace(li);
  }

  const entered = [];
  const settled = [];
  for (const [list, all] of Object.entries(want)) {
    const rows = [];
    const visible = all.slice(-SHOW[list]);
    if (all.length > visible.length) rows.push(note(list, "more", `+${all.length - visible.length} earlier`));
    for (const it of visible) {
      let li = panelItems.get(it.key);
      if (!li) {
        li = el("li");
        li.dataset[it.kind === "open" ? "questionId" : "decisionId"] = it.id;
        li.dataset.seen = String(Date.now());
        li.append(el("span", "mark"), el("span", "txt"));
        panelItems.set(it.key, li);
        entered.push(li);
      } else if (li.dataset.state === "pending" && it.kind === "agreed") {
        settled.push(li);
      }
      updateItem(li, it);
      rows.push(li);
    }
    if (!all.length) rows.push(note(list, "none", EMPTY[list]));
    const ul = lists[list];
    rows.forEach((row, i) => { if (ul.children[i] !== row) ul.insertBefore(row, ul.children[i] ?? null); });
    for (const c of [...ul.children]) if (!rows.includes(c) && !c.classList.contains("m-ghost")) c.remove();
  }

  // Last, invert, play: moved items glide from where they were; a newly agreed one then settles.
  for (const [key, li] of panelItems) {
    const from = before.get(key);
    if (!from) continue;
    const to = li.getBoundingClientRect();
    const dx = from.left - to.left;
    const dy = from.top - to.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) {
      if (settled.includes(li)) playSettled(li);
      continue;
    }
    const a = animate(li, [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }], { duration: GLIDE_MS, easing: EASE });
    glides.set(li, a);
    if (settled.includes(li)) a.finished.then(() => playSettled(li), () => {});
  }
  for (const li of entered) {
    if (before.size) animate(li, [{ opacity: 0, transform: "scale(0.96)" }, { opacity: 1, transform: "none" }], { duration: ENTER_MS, easing: EASE });
  }
}

// ---------- captions ----------
let captions = [];
let partial = null;
let lastCaptionKey;
function renderCaptions() {
  const key = JSON.stringify([captions, partial]);
  if (key === lastCaptionKey) return;
  lastCaptionKey = key;
  const lines = captions.map((c) => cap(c, false));
  if (partial && partial.text) lines.push(cap(partial, true));
  document.getElementById("captions").replaceChildren(...lines.slice(-3));
}
function cap(c, isPartial) {
  const d = el("div", "cap" + (isPartial ? " partial" : "") + (c.isAgent ? " is-agent" : ""));
  d.append(el("b", "", c.isAgent ? "Builder" : c.speaker || "…"), document.createTextNode(c.text || ""));
  return d;
}

function onEvent(ev) {
  switch (ev.type) {
    case "snapshot": {
      const first = !proto;
      proto = ev.proto;
      if (first) ui = { ...initialUiState(proto), screen: ev.uiScreen ?? proto.currentScreen };
      else if (ui && ui.screen !== proto.currentScreen) ui = { ...ui, screen: proto.currentScreen };
      captions = (ev.captions ?? []).filter((c) => !c.partial);
      partial = (ev.captions ?? []).find((c) => c.partial) ?? null;
      draw();
      renderCaptions();
      if (ev.doc) renderDoc(ev.doc);
      if (ev.mood) character.setMood(ev.mood);
      break;
    }
    case "patch": {
      const prevProto = proto;
      const changes = ev.changes ?? [];
      proto = ev.proto;
      if (ui) ui = { ...ui, screen: followScreen(prevProto, changes) };
      draw(changes);
      for (const c of focusTargets(focusable(prevProto, changes), nodes)) focusQueue.enqueue(c);
      break;
    }
    case "pending_region":
      showPendingRegion(ev.parentId ? nodes.get(ev.parentId) ?? null : null);
      break;
    case "command":
      commands = commands
        .then(() => animatePointer(nodes.get(ev.nodeId)))
        .then(() => {
          if (proto && ui) { ui = reduceInteraction(ui, ev.interaction, proto); draw([]); }
        })
        .catch((err) => console.error("command failed", err));
      break;
    case "caption":
      if (ev.caption.partial) partial = ev.caption;
      else { partial = null; captions = [...captions, ev.caption].slice(-3); }
      if (!ev.caption.isAgent) character.hear();
      renderCaptions();
      break;
    case "doc":
      renderDoc(ev.doc);
      break;
    case "mood":
      character.setMood(ev.mood);
      break;
    default:
      break; // comparison, speech: later tasks
  }
}

// Every animation on the stage (CSS and motion) is stepped by the shared 15 fps clock.
startClock();

window.stageEvent = onEvent; // test hooks
window.stageProto = () => proto;
window.stageCharacter = character;
const token = new URLSearchParams(location.search).get("token") ?? "";
window.stage = connectStage({ sessionPath: location.pathname, token, onEvent });
</script>
</body>
